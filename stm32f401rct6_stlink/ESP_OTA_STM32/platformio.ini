; PlatformIO Project Configuration File
;
; ESP32-WROOM-32D -> STM32F401RCT6 remote SWD programmer.
; WiFi STA only + MQTTS commands + HTTP/HTTPS .bin download + SWD flashing.
; No web server, no AP mode, no web UI.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; monitor_filters = esp32_exception_decoder

; LittleFS holds the downloaded /firmware.bin before it is flashed.
; board_build.filesystem = littlefs

; build_flags =
    ; -DCORE_DEBUG_LEVEL=1

lib_deps =
    knolleary/PubSubClient @ ^2.8
